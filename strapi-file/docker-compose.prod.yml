services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-shop_db_prod}
      POSTGRES_USER: ${DATABASE_USERNAME:-shop_user_prod}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_USERNAME:-shop_user_prod}", "-d", "${DATABASE_NAME:-shop_db_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: shop-strapi-prod
    restart: always
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-shop_db_prod}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-shop_user_prod}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: "false"
      NODE_ENV: production
    volumes:
      - strapi_uploads_prod:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "start"]

  caddy:
    image: caddy:2-alpine
    container_name: shop-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - strapi

volumes:
  postgres_data_prod:
  strapi_uploads_prod:
  caddy_data:
  caddy_config:
