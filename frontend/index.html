<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đồng hồ A Tuấn - Cửa hàng đồng hồ cao cấp thiết kế. Phong cách thời thượng với giá thành hợp lý.">
    <title>Cửa hàng đồng hồ A Tuấn - Đồng hồ cao cấp & Phụ kiện chính hãng</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Check localStorage to apply dark mode class before rendering
        if (localStorage.getItem('mvmt_theme') === 'dark' || (!('mvmt_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#111111',
                        accent: '#c5a059',
                        accentHover: '#ab853f',
                        bgDark: '#121212',
                        bgDarkSoft: '#1c1c1c',
                        bgLight: '#fafafa',
                        sale: '#d9534f'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    },
                    letterSpacing: {
                        wide: '0.15em',
                        widest: '0.25em'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style Injection (For simple custom scrollbar and active classes if needed) -->
    <style>
        /* Smooth transitions */
        .transition-slow { transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .transition-normal { transition: all 0.3s ease; }
        .transition-fast { transition: all 0.2s ease; }
        
        /* Underline animations */
        .nav-underline::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1.5px;
            background-color: #c5a059;
            transition: all 0.3s ease;
        }
        .nav-underline:hover::after {
            width: 100%;
        }
        .nav-underline-sale::after {
            background-color: #d9534f;
        }
        
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Gold selection styling */
        ::selection {
            background-color: #c5a059;
            color: #000000;
        }

        /* Ken Burns Effect */
        @keyframes kenBurns {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        .ken-burns {
            animation: kenBurns 12s ease-in-out infinite alternate;
        }

        /* Custom trailing cursor styles */
        .custom-cursor {
            width: 8px;
            height: 8px;
            background-color: #c5a059;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }
        .custom-cursor-follower {
            width: 32px;
            height: 32px;
            border: 1px solid #c5a059;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.08s ease-out, width 0.2s, height 0.2s;
        }
        .custom-cursor-hover {
            width: 12px;
            height: 12px;
            background-color: #ab853f;
        }
        .custom-cursor-follower-hover {
            width: 48px;
            height: 48px;
            background-color: rgba(197, 160, 89, 0.1);
            border-color: #ab853f;
        }
        /* Hide on touch devices */
        @media (hover: none) and (pointer: coarse) {
            .custom-cursor, .custom-cursor-follower { display: none !important; }
        }

        /* Preloader Styles */
        .preloader {
            position: fixed;
            inset: 0;
            background-color: #111111;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .preloader.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .preloader-spinner {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(197, 160, 89, 0.1);
            border-top: 2px solid #c5a059;
            border-radius: 50%;
            animation: spin 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .preloader-brand {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: white;
            letter-spacing: 0.25em;
            margin-top: 20px;
            animation: pulse-brand 2s infinite alternate;
        }
        @keyframes pulse-brand {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Scroll to Top button */
        .scroll-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 45px;
            height: 45px;
            background-color: #111111;
            border: 1px solid rgba(197, 160, 89, 0.4);
            color: #c5a059;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0;
            cursor: pointer;
            z-index: 40;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .scroll-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .scroll-to-top:hover {
            background-color: #c5a059;
            color: white;
            border-color: #c5a059;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.3);
        }

        /* Skeleton Wave */
        @keyframes skeletonWave {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-block {
            background: linear-gradient(90deg, #f3f3f3 25%, #eaeaea 50%, #f3f3f3 75%);
            background-size: 200% 100%;
            animation: skeletonWave 1.5s infinite;
        }
        .dark .skeleton-block {
            background: linear-gradient(90deg, #1f1f1f 25%, #2a2a2a 50%, #1f1f1f 75%);
            background-size: 200% 100%;
            animation: skeletonWave 1.5s infinite;
        }

        /* Tag Pulse */
        @keyframes pulse-tag {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .pulse-tag {
            animation: pulse-tag 2s infinite ease-in-out;
        }

        /* Category Border Draw */
        .category-card::before, .category-card::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border: 0 solid transparent;
            z-index: 20;
            pointer-events: none;
            transition: all 0.5s ease;
        }
        .category-card::before {
            top: 0;
            left: 0;
        }
        .category-card::after {
            bottom: 0;
            right: 0;
        }
        .category-card:hover::before {
            width: 100%;
            height: 100%;
            border-top: 1.5px solid #c5a059;
            border-right: 1.5px solid #c5a059;
        }
        .category-card:hover::after {
            width: 100%;
            height: 100%;
            border-bottom: 1.5px solid #c5a059;
            border-left: 1.5px solid #c5a059;
        }

        /* Old Price Line Draw */
        .old-price-line {
            position: relative;
            display: inline-block;
        }
        .old-price-line::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0;
            height: 1px;
            background-color: currentColor;
            transition: width 0.4s ease;
        }
        .group:hover .old-price-line::after {
            width: 100%;
        }

        /* Heading text reveal */
        .reveal-container {
            overflow: hidden;
            display: block;
        }
        .reveal-text {
            display: block;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.8s ease;
        }
        .reveal-container.revealed .reveal-text {
            transform: translateY(0);
            opacity: 1;
        }

        /* Floating Badge */
        @keyframes float-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .float-bob {
            animation: float-bob 4s ease-in-out infinite;
        }

        /* Hero character stagger keyframe */
        @keyframes staggerReveal {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .stagger-char {
            display: inline-block;
            opacity: 0;
            animation: staggerReveal 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
    </style>
</head>
<body class="bg-white text-primary font-sans antialiased overflow-x-hidden">

    <!-- App Mounting Container -->
    <div id="app"></div>

    <!-- Entry Point Module -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
